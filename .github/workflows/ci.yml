name: CI - Build & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (FastAPI + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx

      - name: Validate notes catalogue compilation
        run: |
          python tooling/build_notes.py

      - name: Run Pytest test suite
        env:
          ENVIRONMENT: development
          ALLOW_DEV_MOCK_LOGIN: "true"
          JWT_PRIVATE_KEY_B64: ""
          JWT_PUBLIC_KEY_B64: ""
        run: |
          pytest tests/ -v

  frontend-test-and-build:
    name: Frontend Tests & Build (React 19 + Vitest + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci

      - name: Run Vitest acceptance tests
        run: |
          cd web
          npm test

      - name: Run TypeScript type-check and Vite build
        run: |
          cd web
          npm run build
